[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "deeplearning-101"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "torch",
    "torchvision",
    "torchmetrics",
    "pytorch-lightning",
    "transformers",
    "matplotlib",
    "numpy",
    "pandas",
    "tqdm",
    "mlxtend",
]

[project.optional-dependencies]
gpu = ["modal"]
kernels = ["triton"]
llm = ["peft>=0.8.0", "bitsandbytes>=0.43.0", "trl>=0.10.0", "datasets>=2.18.0", "accelerate>=0.27.0"]
rl = ["gymnasium>=0.29.0"]

[tool.setuptools.packages.find]
include = ["src*"]
